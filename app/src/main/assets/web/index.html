<!DOCTYPE html>
<!--
  §7.3 BROWSER SHELL. Self-contained: no CDN, no font download, no network
  dependency of any kind — the whole point of the product is that it works
  with no internet (§3.4).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Morsecode</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body data-theme="dark">
  <!-- §7.1: a new session sees ONLY this until the phone accepts (A5). -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-icon" aria-hidden="true">◎</div>
      <h1 id="gate-title">Waiting for approval on the phone…</h1>
      <p id="gate-body">Accept the request on your phone to browse its files.</p>
    </div>
  </div>

  <div id="shell" class="shell" hidden>
    <!-- §7.3 left icon rail, 88 px, with live counts. -->
    <nav class="rail" aria-label="Sections">
      <div class="rail-logo" aria-hidden="true">M</div>
      <button class="rail-item" data-page="home"><span>Home</span><em id="count-home"></em></button>
      <button class="rail-item" data-page="photos"><span>Photos</span><em id="count-photos">0</em></button>
      <button class="rail-item" data-page="videos"><span>Videos</span><em id="count-videos">0</em></button>
      <button class="rail-item" data-page="music"><span>Music</span><em id="count-music">0</em></button>
      <button class="rail-item" data-page="docs"><span>Docs</span><em id="count-docs">0</em></button>
      <button class="rail-item" data-page="apps"><span>Apps</span><em id="count-apps">0</em></button>
      <button class="rail-item" data-page="files"><span>Files</span><em id="count-files"></em></button>
      <div class="rail-foot">
        <div class="session-dot" id="session-state">● Connected</div>
        <button id="end-session" class="rail-end">End session</button>
      </div>
    </nav>

    <main class="content">
      <header class="topbar">
        <div>
          <div class="device" id="device-name">Phone</div>
          <div class="mono" id="device-address">WebShare session</div>
        </div>
        <div class="topbar-right">
          <span class="pill-connected" id="connected-pill">● Connected</span>
          <button class="btn-accent" id="send-files">⇪ Send files</button>
        </div>
      </header>

      <section id="page" class="page" aria-live="polite"></section>
    </main>
  </div>

  <!-- §7.5 the mandatory lightbox (A27). -->
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
    <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous">‹</button>
    <img id="lightbox-image" alt="" />
    <button class="lightbox-next" id="lightbox-next" aria-label="Next">›</button>
    <div class="lightbox-meta">
      <div id="lightbox-name"></div>
      <div class="mono" id="lightbox-info"></div>
      <div class="lightbox-actions">
        <button id="lightbox-download" class="btn-outline">⇓ Download</button>
        <button id="lightbox-select" class="btn-outline">Select</button>
      </div>
    </div>
  </div>

  <!-- §7.5 the persistent, CLOSABLE audio bar (A20). -->
  <div id="player" class="player" hidden>
    <div class="player-art" aria-hidden="true">♪</div>
    <div class="player-text">
      <div id="player-title"></div>
      <div class="mono" id="player-artist"></div>
    </div>
    <div class="player-seek">
      <input id="player-range" class="seek" type="range" min="0" max="1000" value="0"
             aria-label="Playback position" />
      <div class="player-clocks mono"><span id="player-elapsed">0:00</span><span id="player-total">0:00</span></div>
    </div>
    <button id="player-prev" class="icon-btn" aria-label="Previous">‹‹</button>
    <button id="player-play" class="btn-accent" aria-label="Pause">❚❚</button>
    <button id="player-next" class="icon-btn" aria-label="Next">››</button>
    <label class="volume">
      <span aria-hidden="true">🔊</span>
      <input id="player-volume" type="range" min="0" max="100" value="70" aria-label="Volume" />
    </label>
    <button id="player-close" class="icon-btn" aria-label="Close player">✕</button>
  </div>

  <!-- §7.7 INV-6: exactly ONE upload progress UI. -->
  <aside id="tray" class="tray" hidden aria-label="Transfers">
    <header><span>Transfers</span><button id="tray-toggle" class="icon-btn" aria-label="Collapse">▾</button></header>
    <div id="tray-items"></div>
  </aside>

  <input id="file-input" type="file" multiple hidden />
  <script src="/assets/app.js"></script>
</body>
</html>
