#
# Morsecode CI — spec §19.3.
# On push: run the §20.8 lint gate and the unit tests, assemble the release and
# debug APKs, and publish BOTH as downloadable release assets.
#
# SIGNING (§19.3 SIGNING KEY RULE): the release APK is signed with ONE stable
# upload key held in repo secrets. Generating a throwaway key per build is
# forbidden. When the secrets are absent the release variant is built with the
# debug key, the artifact is named `-preview-unsigned`, the run summary says so
# and §19.3 / A18 are reported as NOT satisfied.
#
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint gate (§20.8)
        run: python3 tools/lintgate.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the upload key, when the secrets exist (§19.3)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
            {
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
              echo "storePassword=$STORE_PASSWORD"
            } > keystore.properties
            # Fail HERE, with a readable message, rather than three minutes
            # later inside Gradle: a mistyped password or a truncated base64
            # blob is the likeliest thing to go wrong on the first attempt.
            if ! keytool -list -keystore upload-keystore.jks \
                 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::The signing secrets are present but the keystore" \
                   "could not be opened. Check KEYSTORE_B64 (must be one line," \
                   "base64 of the .jks), KEY_ALIAS, and STORE_PASSWORD."
              exit 1
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests (§21.1)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build.log

      # Job logs are not readable with this token from outside the runner, so a
      # failure has to leave its evidence somewhere the API returns (§22.1).
      - name: Failure report
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          {
            echo "**FAILED** run ${{ github.run_id }} at ${{ github.sha }}."
            echo ""
            python3 tools/failreport.py build.log
          } > failure-notes.md
          cat failure-notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease \
              --title "Morsecode CI — ${{ github.ref_name }}" \
              --notes-file failure-notes.md
          else
            gh release edit "$TAG" --notes-file failure-notes.md
          fi

      # The build machine's artifacts are not reachable from the development
      # sandbox, so the test tally is carried in the release notes, which are
      # readable through the API. §22.1 evidence has to be inspectable.
      - name: Unit test tally (§21.1)
        id: tests
        run: |
          TALLY=$(python3 tools/testtally.py)
          echo "$TALLY"
          echo "tally=$TALLY" >> "$GITHUB_OUTPUT"

      - name: Assemble debug and release (§19.3)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Name the artifacts
        id: artifacts
        run: |
          mkdir -p dist
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "dist/morsecode-${VERSION}-debug.apk"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/morsecode-${VERSION}-release.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/morsecode-${VERSION}-preview-unsigned.apk"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -l dist

      # §19.3 / A18: prove the artifact, do not assume it. A release APK that
      # silently kept the debug key would satisfy nobody, so this step fails
      # the build if the secrets were present and the signature is not theirs.
      - name: Verify the release signature (§19.3)
        id: signature
        run: |
          APK=$(ls dist/morsecode-*-release.apk dist/morsecode-*-preview-unsigned.apk 2>/dev/null | head -1)
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -r | head -1)
          if [ -n "$APKSIGNER" ]; then
            CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null || true)
          else
            CERTS=$(keytool -printcert -jarfile "$APK" 2>/dev/null || true)
          fi
          FINGERPRINT=$(echo "$CERTS" | grep -i -m1 'SHA-256' | sed 's/.*: *//')
          SUBJECT=$(echo "$CERTS" | grep -i -m1 'Owner\|Subject DN' | sed 's/.*: *//')
          echo "fingerprint=${FINGERPRINT:-unknown}" >> "$GITHUB_OUTPUT"
          echo "subject=${SUBJECT:-unknown}" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            if echo "$SUBJECT" | grep -qi 'Android Debug'; then
              echo "::error::Signing secrets were present but the release APK" \
                   "carries the DEBUG certificate. §19.3 is not satisfied."
              exit 1
            fi
            echo "Release APK signed by: $SUBJECT"
            echo "SHA-256: $FINGERPRINT"
          else
            echo "No upload key configured — this is the debug-key preview build."
          fi

      - name: Run summary
        run: |
          {
            echo "## Morsecode ${{ steps.artifacts.outputs.version }} (1)"
            echo ""
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "- Release APK signed with the stable upload key (§19.3 satisfied)."
            else
              echo "- **No upload-key secrets present.** The release variant was built with the"
              echo "  debug key and published as \`-preview-unsigned\`. §19.3 and A18 are NOT"
              echo "  satisfied until KEYSTORE_B64 / KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD exist."
            fi
            echo "- Unit tests: ${{ steps.tests.outputs.tally }}"
            echo "- Signing certificate: ${{ steps.signature.outputs.subject }}"
            echo "- Certificate SHA-256: ${{ steps.signature.outputs.fingerprint }}"
            echo "- Sizes (budget §19.4: release ~6.5 MB, debug ~8 MB):"
            echo ""
            echo '```'
            du -h dist/* || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morsecode-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish both APKs as release assets (§19.3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          NOTES=$(printf '%s\n' \
            "Rolling CI build of \`${{ github.ref_name }}\` at ${{ github.sha }}." \
            "" \
            "- run: ${{ github.run_id }}" \
            "- unit tests: ${{ steps.tests.outputs.tally }}" \
            "- lint gate (§20.8): passed" \
            "- signed with the stable upload key: ${{ steps.signing.outputs.signed }}" \
            "- signing certificate: ${{ steps.signature.outputs.subject }}" \
            "- certificate SHA-256: ${{ steps.signature.outputs.fingerprint }}" \
            "" \
            "\`\`\`" \
            "$(du -h dist/* | sed 's/\t/  /')" \
            "\`\`\`")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --prerelease \
              --title "Morsecode CI — ${{ github.ref_name }}" \
              --notes "$NOTES"
          else
            gh release edit "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/*.apk --clobber
